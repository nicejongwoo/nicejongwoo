<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Blog Post | 이종우</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js (Markdown Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js (Code Syntax Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        .post-container {
            max-width: 860px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }
        .post-back-bar {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            background: var(--primary-color);
            color: #fff;
        }
        .post-header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 35px 25px;
            margin-bottom: 30px;
        }
        .post-category-tag {
            display: inline-block;
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .post-main-title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.35;
            color: var(--text-color);
            margin-bottom: 12px;
        }
        .post-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13.5px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            margin-top: 14px;
        }
        .post-tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .post-tag-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        /* Markdown Content Area */
        .markdown-body {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 45px;
            color: var(--text-color);
            line-height: 1.75;
            font-size: 15.5px;
            word-break: keep-all;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
            color: var(--text-color);
            font-weight: 700;
            margin-top: 32px;
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .markdown-body h1 { font-size: 24px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .markdown-body h2 { font-size: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .markdown-body h3 { font-size: 17px; }
        .markdown-body p { margin-bottom: 16px; }
        .markdown-body ul, .markdown-body ol { padding-left: 24px; margin-bottom: 16px; }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body blockquote {
            border-left: 4px solid var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
            padding: 12px 18px;
            margin: 18px 0;
            border-radius: 0 8px 8px 0;
            color: var(--text-muted);
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 30px 0;
        }
        .markdown-body a {
            color: var(--primary-color);
            text-decoration: underline;
            font-weight: 500;
        }
        /* Code Styling */
        .markdown-body code {
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            background: rgba(125, 125, 125, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13.5px;
            color: var(--primary-color);
        }
        .markdown-body pre {
            position: relative;
            background: #1e1e1e !important;
            padding: 16px 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid #333;
        }
        .markdown-body pre code {
            background: transparent !important;
            padding: 0;
            color: #dcdcdc;
            font-size: 13.5px;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #ccc;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-code-btn:hover {
            background: var(--primary-color);
            color: #fff;
        }
        /* Table */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            text-align: left;
        }
        .markdown-body th {
            background: var(--bg-color);
            font-weight: 700;
        }
        /* Loading & Error */
        .loading-box {
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand" style="text-decoration: none;">LEE JONG WOO</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html#home" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#skills" class="nav-link">Skills</a></li>
                <li><a href="index.html#career" class="nav-link">Career</a></li>
                <li><a href="index.html#projects" class="nav-link">Projects</a></li>
                <li><a href="index.html#blog" class="nav-link active">Blog</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="post-container">
        <!-- Top Back Bar -->
        <div class="post-back-bar">
            <a href="index.html#blog" class="back-btn">← 전체 글 목록으로</a>
            <span id="postReadTime" style="font-size: 13px; color: var(--text-muted);"></span>
        </div>

        <!-- Post Header -->
        <div class="post-header-card" id="postHeaderCard">
            <span class="post-category-tag" id="postCategory">Tech Guide</span>
            <h1 class="post-main-title" id="postTitle">블로그 글을 불러오는 중입니다...</h1>
            <div class="post-meta-row">
                <span id="postDate">📅 2026-08-24</span>
                <span>•</span>
                <span>작성자: <strong>이종우</strong></span>
            </div>
            <div class="post-tags-list" id="postTags"></div>
        </div>

        <!-- Markdown Content -->
        <article class="markdown-body" id="markdownContent">
            <div class="loading-box">⏳ 콘텐츠를 로딩하고 있습니다...</div>
        </article>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 LEE JONG WOO. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const theme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
        });

        // Parse URL params
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id') || '1-docker-dev-env-setup';

        async function loadPost() {
            try {
                // 1. Fetch metadata
                const metaRes = await fetch('posts/posts.json');
                const posts = await metaRes.json();
                const currentPost = posts.find(p => p.id === postId) || posts[0];

                // Set header metadata
                document.title = `${currentPost.title} | 이종우 Tech Blog`;
                document.getElementById('postTitle').innerText = currentPost.title;
                document.getElementById('postCategory').innerText = currentPost.category || 'Tech';
                document.getElementById('postDate').innerText = `📅 ${currentPost.date}`;
                document.getElementById('postReadTime').innerText = `⏱️ ${currentPost.readTime || '5 min read'}`;

                const tagsContainer = document.getElementById('postTags');
                tagsContainer.innerHTML = '';
                if (currentPost.tags) {
                    currentPost.tags.forEach(tag => {
                        const span = document.createElement('span');
                        span.className = 'post-tag-item';
                        span.innerText = `#${tag}`;
                        tagsContainer.appendChild(span);
                    });
                }

                // 2. Fetch Markdown content
                const mdRes = await fetch(`posts/${currentPost.file}`);
                if (!mdRes.ok) throw new Error('Markdown file not found');
                const mdText = await mdRes.text();

                // 3. Render Markdown
                marked.setOptions({
                    highlight: function(code, lang) {
                        const language = highlight.getLanguage(lang) ? lang : 'plaintext';
                        return highlight.highlight(code, { language }).value;
                    },
                    breaks: true,
                    gfm: true
                });

                const htmlContent = marked.parse(mdText);
                const contentElem = document.getElementById('markdownContent');
                contentElem.innerHTML = htmlContent;

                // Add copy buttons to code blocks
                contentElem.querySelectorAll('pre').forEach(pre => {
                    const btn = document.createElement('button');
                    btn.className = 'copy-code-btn';
                    btn.innerText = 'Copy';
                    btn.addEventListener('click', () => {
                        const code = pre.querySelector('code').innerText;
                        navigator.clipboard.writeText(code).then(() => {
                            btn.innerText = 'Copied!';
                            setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
                        });
                    });
                    pre.appendChild(btn);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('markdownContent').innerHTML = `
                    <div class="loading-box" style="color:#ef4444;">
                        ⚠️ 글을 불러오는 중 오류가 발생했습니다.<br>
                        <a href="index.html#blog" style="margin-top:15px; display:inline-block;">홈으로 돌아가기</a>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
